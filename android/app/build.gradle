apply plugin: 'com.android.application'

def releaseSigningConfigFile = rootProject.file('release-signing.properties')
if (!releaseSigningConfigFile.exists()) {
    releaseSigningConfigFile = file('release-signing.properties')
}
def releaseProperties = new Properties()
if (releaseSigningConfigFile.exists()) {
    releaseProperties.load(new FileInputStream(releaseSigningConfigFile))
}

// GOAL-117: origem das credenciais é ATÔMICA. Se qualquer GYMFLOW_RELEASE_*
// estiver no ambiente, as 4 vêm do ambiente (o properties local da chave
// interna é ignorado); env parcial falha o build em vez de misturar keystore
// de uma chave com alias/senha de outra.
def signingEnvNames = ['GYMFLOW_RELEASE_STORE_FILE', 'GYMFLOW_RELEASE_STORE_PASSWORD',
                       'GYMFLOW_RELEASE_KEY_ALIAS', 'GYMFLOW_RELEASE_KEY_PASSWORD']
def presentSigningEnv = signingEnvNames.findAll { System.getenv(it) }
if (!presentSigningEnv.isEmpty() && presentSigningEnv.size() != signingEnvNames.size()) {
    throw new GradleException("Assinatura release: defina as 4 variaveis ${signingEnvNames} ou nenhuma (presentes: ${presentSigningEnv}).")
}
def useSigningEnv = presentSigningEnv.size() == signingEnvNames.size()

def storeFilePath = useSigningEnv ? System.getenv('GYMFLOW_RELEASE_STORE_FILE') : releaseProperties.getProperty('storeFile')
def storePasswordValue = useSigningEnv ? System.getenv('GYMFLOW_RELEASE_STORE_PASSWORD') : releaseProperties.getProperty('storePassword')
def keyAliasValue = useSigningEnv ? System.getenv('GYMFLOW_RELEASE_KEY_ALIAS') : releaseProperties.getProperty('keyAlias')
def keyPasswordValue = useSigningEnv ? System.getenv('GYMFLOW_RELEASE_KEY_PASSWORD') : releaseProperties.getProperty('keyPassword')

def hasReleaseCredentials = storeFilePath && storePasswordValue && keyAliasValue && keyPasswordValue

android {
    namespace "com.gymflowai.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.gymflowai.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseCredentials) {
                def resolvedStoreFile = file(storeFilePath)
                if (!resolvedStoreFile.exists() && rootProject.file(storeFilePath).exists()) {
                    resolvedStoreFile = rootProject.file(storeFilePath)
                }
                storeFile resolvedStoreFile
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseCredentials) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
